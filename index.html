<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple Shop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    text-align: center;
  }
  header {
    padding: 10px 0;
    background: #fff;
  }
  .logo-placeholder {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .product {
    background: white;
    max-width: 300px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    cursor: pointer;
    display: inline-block;
    transition: transform 0.3s ease;
    transform-origin: center bottom;
  }
  /* Bending hover effect */
  .product:hover {
    transform: perspective(600px) rotateX(10deg);
  }
  /* Click shrink animation */
  .product:active {
    animation: clickShrink 0.3s forwards;
  }
  @keyframes clickShrink {
    0% {
      transform: scale(1) perspective(600px) rotateX(10deg);
    }
    50% {
      transform: scale(0.9) perspective(600px) rotateX(10deg);
    }
    100% {
      transform: scale(1) perspective(600px) rotateX(10deg);
    }
  }

  /* Popup style */
  .popup {
    display: none;
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border-radius: 10px;
    padding: 20px 40px;
    box-shadow: 0px 4px 20px rgba(0,0,0,0.25);
    font-size: 18px;
    z-index: 1000;
  }
  .popup.show {
    display: block;
  }
  /* Overlay behind popup */
  .overlay {
    display: none;
    position: fixed;
    top:0; left:0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.3);
    z-index: 999;
  }
  .overlay.show {
    display: block;
  }
</style>
</head>
<body>

<header>
  <div class="logo-placeholder">Simple Shop Logo</div>
</header>

<div class="product" onclick="showPopup()">
  <h2>Drinks</h2>
  <p>Price: 50 bread</p>
</div>

<div class="product" onclick="showPopup()">
  <h2>Candy</h2>
  <p>Price: 40 bread</p>
</div>

<div class="product" onclick="showPopup()">
  <h2>Chips</h2>
  <p>Price: 50 bread</p>
</div>

<div id="overlay" class="overlay"></div>
<div id="popup" class="popup">Talk to Seth</div>

<script>
  function showPopup() {
    const popup = document.getElementById('popup');
    const overlay = document.getElementById('overlay');
    popup.classList.add('show');
    overlay.classList.add('show');
    overlay.onclick = hidePopup;
    setTimeout(hidePopup, 3000); // auto-hide after 3 seconds
  }
  function hidePopup() {
    const popup = document.getElementById('popup');
    const overlay = document.getElementById('overlay');
    popup.classList.remove('show');
    overlay.classList.remove('show');
  }
</script>

</body>
</html>
